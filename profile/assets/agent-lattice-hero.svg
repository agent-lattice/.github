<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Lattice 自托管 Managed Agent 平台</title>
  <desc id="desc">Agent Lattice 基于 Claude Code、OpenAI Codex 等顶尖 Agent 框架，提供 Managed Agent 的开源私有化版本。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.46" stop-color="#12323A"/>
      <stop offset="1" stop-color="#163B2F"/>
    </linearGradient>
    <linearGradient id="panel" x1="110" y1="96" x2="1090" y2="356" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="70" y="50" width="1060" height="340" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <path d="M80 340 C210 265 285 367 410 298 C540 226 618 305 744 237 C877 166 969 225 1120 132" stroke="#67E8F9" stroke-opacity="0.20" stroke-width="2"/>
  <path d="M75 95 C208 170 321 76 444 138 C579 206 684 112 813 170 C942 229 1039 146 1126 205" stroke="#A7F3D0" stroke-opacity="0.18" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="110" y="76" width="980" height="278" rx="24" fill="url(#panel)" stroke="#D1FAE5" stroke-opacity="0.22"/>
    <g transform="translate(150 116)">
      <path d="M52 0 L104 30 L104 90 L52 120 L0 90 L0 30 Z" fill="#ECFEFF" fill-opacity="0.94"/>
      <path d="M52 22 L85 41 L85 79 L52 98 L19 79 L19 41 Z" fill="#0F766E"/>
      <path d="M52 41 L68 50 L68 70 L52 79 L36 70 L36 50 Z" fill="#ECFEFF"/>
    </g>
    <text x="300" y="150" fill="#F8FAFC" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="800">Agent Lattice</text>
    <text x="302" y="196" fill="#BAE6FD" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="650">Managed Agent 的开源私有化版本</text>
    <text x="302" y="236" fill="#E2E8F0" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="20">基于 Claude Code / Codex 装配，不从零重造 Agent harness</text>
    <g transform="translate(302 270)" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="650">
      <rect x="0" y="0" width="138" height="38" rx="19" fill="#14B8A6"/>
      <text x="24" y="25" fill="#042F2E">Claude Code</text>
      <rect x="154" y="0" width="112" height="38" rx="19" fill="#38BDF8"/>
      <text x="186" y="25" fill="#082F49">Codex</text>
      <rect x="282" y="0" width="154" height="38" rx="19" fill="#A7F3D0"/>
      <text x="306" y="25" fill="#064E3B">私有化托管</text>
      <rect x="452" y="0" width="138" height="38" rx="19" fill="#FDE68A"/>
      <text x="476" y="25" fill="#713F12">人机审批</text>
    </g>
  </g>
</svg>
