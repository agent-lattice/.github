<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent Lattice 平台架构图</title>
  <desc id="desc">Manager UI 通过统一 Agent UI 协议连接 Agent Gateway，Gateway 调度 Worker 沙箱和多种 Agent 执行器。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0F766E"/>
    </marker>
    <filter id="shadow" x="0" y="0" width="1200" height="620" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="26" fill="#F8FAFC"/>
  <text x="600" y="64" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="34" font-weight="800">Agent Lattice 架构概览</text>
  <text x="600" y="100" text-anchor="middle" fill="#475569" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="18">产品界面与 Agent 内核解耦，运行、审批和数据控制集中在平台层</text>
  <g filter="url(#shadow)" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif">
    <rect x="118" y="145" width="964" height="95" rx="18" fill="#ECFEFF" stroke="#67E8F9"/>
    <text x="600" y="184" text-anchor="middle" fill="#0F172A" font-size="25" font-weight="800">Manager UI / 产品前端</text>
    <text x="600" y="217" text-anchor="middle" fill="#475569" font-size="17">对话 · 审批 · 文件 · 工具调用 · 状态看板 · 用户空间</text>
    <path d="M600 250 V300" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="118" y="310" width="964" height="112" rx="18" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="600" y="352" text-anchor="middle" fill="#0F172A" font-size="25" font-weight="800">Agent Gateway / 控制层</text>
    <text x="600" y="386" text-anchor="middle" fill="#475569" font-size="17">会话调度 · 模板分发 · 事件流 · 生命周期 · 审批编排 · 用户隔离</text>
    <path d="M600 432 V482" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(118 500)">
      <rect width="285" height="78" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="142" y="34" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="750">Docker Worker</text>
      <text x="142" y="58" text-anchor="middle" fill="#64748B" font-size="14">本地沙箱与工具执行</text>
    </g>
    <g transform="translate(457 500)">
      <rect width="285" height="78" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="142" y="34" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="750">Serverless Worker</text>
      <text x="142" y="58" text-anchor="middle" fill="#64748B" font-size="14">云函数与弹性任务</text>
    </g>
    <g transform="translate(797 500)">
      <rect width="285" height="78" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="142" y="34" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="750">Custom Runtime</text>
      <text x="142" y="58" text-anchor="middle" fill="#64748B" font-size="14">Claude · OpenAI · Gemini · 本地模型</text>
    </g>
  </g>
  <text x="600" y="282" text-anchor="middle" fill="#0F766E" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700">统一 Agent UI 协议</text>
  <text x="600" y="464" text-anchor="middle" fill="#0F766E" font-family="Inter, Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700">可插拔 Worker Provider</text>
</svg>
